name: Independent Al-Hadr alignment
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/independent-alignment.py'
      - '.github/workflows/independent-alignment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install 'git+https://github.com/voltarostudio/quran-word-align@1228d6f4e6b4a0e1cd0bf381ec56928bb322c7d1'
      - run: python tests/independent-alignment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-alhadr-candidates
          path: independent-alignment/
